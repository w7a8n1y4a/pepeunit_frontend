overwrite: true
schema: 'https://devunit.pepeunit.com/pepeunit/graphql'
documents: 'src/gql/**/**.ts'
generates:
    src/rootTypes/schemaTypes.ts:
        plugins:
            - typescript
        config:
            skipTypename: false
            enumsAsTypes: false
            scalars:
                Date: string
                DateTime: string
                UUID: string
                Number: number
                Upload: File
                JSON: Record<string, unknown>
    src/rootTypes/generated.ts:
        plugins:
            - typescript-operations
            - typed-document-node
        config:
            skipTypename: false
            onlyOperationTypes: true
            enumsAsTypes: false
            preResolveTypes: false
            scalars:
                Date: string
                DateTime: string
                UUID: string
                Number: number
                Upload: File
                JSON: Record<string, unknown>
